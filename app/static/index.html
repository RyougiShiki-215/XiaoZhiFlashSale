<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪购小智 · 对话</title>
<style>
  :root {
    --primary: #4f7cff;
    --primary-weak: #eaf0ff;
    --bg: #f5f6fa;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a91a3;
    --border: #e6e8ef;
    --user-bubble: #4f7cff;
    --assistant-bubble: #f0f2f7;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app {
    width: 100%;
    max-width: 860px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    box-shadow: 0 0 40px rgba(0,0,0,.06);
  }
  header {
    padding: 14px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  header .logo {
    width: 38px; height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #4f7cff, #7fa9ff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 700;
  }
  header .meta { flex: 1; }
  header .title { font-weight: 700; font-size: 16px; }
  header .sub { font-size: 12px; color: var(--muted); }
  header .status {
    font-size: 12px; padding: 4px 10px; border-radius: 999px;
    background: var(--primary-weak); color: var(--primary);
    display: flex; align-items: center; gap: 6px;
  }
  header .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
  header .status.error { background: #ffecec; color: #d33; }
  header .status.error .dot { background: #d33; }

  .memory-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 22px; border-bottom: 1px solid var(--border);
    font-size: 13px; color: var(--muted); flex-shrink: 0;
  }
  .memory-bar label { white-space: nowrap; }
  .memory-bar input {
    width: 90px; padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 8px; font-size: 13px;
  }
  .memory-bar .topics { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: linear-gradient(180deg, #fafbff 0%, #f5f6fa 100%);
  }
  .msg { display: flex; gap: 10px; max-width: 100%; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
  .msg.assistant { align-self: flex-start; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  .msg.assistant .avatar { background: linear-gradient(135deg,#4f7cff,#7fa9ff); color:#fff; }
  .msg.user .avatar { background: var(--border); color: var(--muted); }
  .bubble {
    padding: 11px 14px; border-radius: var(--radius);
    font-size: 14px; line-height: 1.65; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .bubble {
    background: var(--assistant-bubble);
    border-top-left-radius: 4px;
  }
  .msg.user .bubble {
    background: var(--user-bubble); color: #fff;
    border-top-right-radius: 4px;
  }
  .bubble b { font-weight: 600; }
  .bubble code {
    background: rgba(0,0,0,.06); padding: 1px 5px; border-radius: 5px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  }
  .bubble pre {
    background: #0f1720; color: #e6edf3; padding: 12px; border-radius: 10px;
    overflow-x: auto; margin: 8px 0;
  }
  .bubble pre code { background: none; color: inherit; padding: 0; }
  .bubble ul, .bubble ol { padding-left: 20px; }
  .typing {
    display: inline-flex; gap: 4px; align-items: center; padding: 2px 0;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    animation: blink 1.2s infinite; opacity: .3;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100%{opacity:.3} 40%{opacity:1} }
  .plan-chip {
    font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px;
    padding-left: 44px;
  }
  .plan-chip .goal { color: var(--primary); }

  footer {
    padding: 12px 22px 16px; border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .input-row { display: flex; gap: 10px; }
  .input-row textarea {
    flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px;
    padding: 11px 14px; font-size: 14px; font-family: inherit; line-height: 1.5;
    outline: none; max-height: 120px; transition: border .2s, box-shadow .2s;
  }
  .input-row textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-weak); }
  .input-row button {
    border: none; border-radius: 12px; padding: 0 22px;
    background: linear-gradient(135deg, #4f7cff, #3f66e0); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer; transition: transform .1s, opacity .2s;
  }
  .input-row button:disabled { opacity: .55; cursor: not-allowed; }
  .input-row button:not(:disabled):active { transform: scale(.97); }
  .logo-font { font-weight: 500; }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo">智</div>
      <div class="meta">
        <div class="title">闪购小智</div>
        <div class="sub">Plan-and-Execute Agent · LangGraph · python-langgraph 后端</div>
      </div>
      <div id="status" class="status"><span class="dot"></span><span id="statusText">连接中…</span></div>
    </header>

    <div class="memory-bar">
      <label for="memoryId">memoryId</label>
      <input id="memoryId" type="number" value="1" min="1">
      <span id="topics" class="topics logo-font"></span>
    </div>

    <main id="messages"></main>

    <footer>
      <div class="input-row">
        <textarea id="input" rows="1" placeholder="输入消息，例如：帮我推荐附近合适的餐厅…（Enter 发送，Shift+Enter 换行）"></textarea>
        <button id="send">发送</button>
      </div>
    </footer>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const msgBox = $('messages');
const input = $('input');
let busy = false;

async function checkHealth() {
  const el = $('status');
  try {
    const r = await fetch('/xiaozhi/health');
    const d = await r.json();
    el.className = 'status';
    $('statusText').textContent = '已连接 · ' + d.tools.length + ' 个工具';
    $('topics').textContent = 'Skill: ' + (d.skills.join(', ') || '-');
  } catch (e) {
    el.className = 'status error';
    $('statusText').textContent = '后端连接失败';
  }
}

function scrollDown() { msgBox.scrollTop = msgBox.scrollHeight; }

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="avatar">${role === 'assistant' ? '智' : '你'}</div><div class="bubble">${html}</div>`;
  msgBox.appendChild(div);
  scrollDown();
  return div;
}
function addPlanChip(text) {
  const div = document.createElement('div');
  div.className = 'plan-chip';
  div.innerHTML = `<span class="goal">🧭</span> 规划：<span class="goal">${text}</span>`;
  msgBox.appendChild(div);
  scrollDown();
}
function addTyping() {
  const div = addMsg('assistant', '<span class="typing"><span></span><span></span><span></span></span>');
  return div.querySelector('.bubble');
}

// 简易 markdown：代码块、加粗、行内代码、列表、换行
function mdEscape(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function render(text) {
  let s = mdEscape(text);
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, (m,l,code) => `<pre><code>${code.trim()}</code></pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/^#{1,4}\s+(.+)$/gm, '<b>$1</b>\n');
  return s.replace(/\n/g, '\n');
}

async function send() {
  if (busy) return;
  const text = input.value.trim();
  if (!text) return;

  addMsg('user', render(text));
  input.value = '';
  input.style.height = 'auto';
  const bubble = addTyping();
  const memoryId = parseInt($('memoryId').value) || 1;
  busy = true;
  $('send').disabled = true;

  try {
    const res = await fetch('/xiaozhi/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memoryId, message: text })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let full = '';
    let first = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const frame = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        if (!frame.startsWith('data:')) continue;
        const raw = frame.slice(5).trim();
        if (!raw) continue;
        let evt;
        try { evt = JSON.parse(raw); } catch { continue; }

        if (evt.type === 'plan_start' || evt.type === 'plan_ready') {
          // 规划类事件不展示，仅做流程占位
        } else if (evt.type === 'step_start') {
          // 规划过程中不打断打字
        } else if (evt.type === 'token') {
          if (first) { bubble.innerHTML = ''; first = false; }
          full += (evt.content || '');
          bubble.innerHTML = render(full);
          scrollDown();
          // 让出渲染帧：同一网络 chunk 可能含多个 token 帧，
          // 若不 yield，浏览器会把本次 task 内的所有 DOM 更新合并为一次重绘 → 看起来"整段跳出"
          await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
        } else if (evt.type === 'error') {
          bubble.innerHTML = render('⚠️ ' + (evt.message || evt.detail || '出错了'));
          busy = false; $('send').disabled = false;
          return;
        } else if (evt.type === 'done') {
          // 结束
        }
      }
    }
    // 无 token 事件，直接用缓冲区剩余兜底显示完整文本
    if (full === '') {
      try { full = decoder.decode(); if (full) bubble.innerHTML = render(full); } catch {}
    }
    busy = false;
    $('send').disabled = false;
  } catch (e) {
    bubble.innerHTML = render('⚠️ 请求失败：' + (e.message || e));
    busy = false;
    $('send').disabled = false;
  }
}

$('send').addEventListener('click', send);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});

addMsg('assistant', '你好，我是闪购小智 👋 我是基于 LangGraph 的 Plan-and-Execute 智能体。\n\n可以问我：\n• 推荐附近合适的餐厅\n• 帮我查一下我的历史订单\n• 我今天有哪些可用优惠券');
checkHealth();
</script>
</body>
</html>
